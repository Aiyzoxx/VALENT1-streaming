name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --clean --non-interactive

      - name: Install CocoaPods (génère le .xcworkspace)
        run: cd ios && pod install

      - name: Locate Xcode workspace and scheme
        run: |
          ls ios/
          WS_FILE=$(ls -d ios/*.xcworkspace | head -1)
          echo "Workspace: $WS_FILE"
          test -n "$WS_FILE" || (echo "Aucun .xcworkspace genere par prebuild" && exit 1)
          echo "WORKSPACE=$WS_FILE" >> $GITHUB_ENV
          SCHEME=$(basename $(ls "$WS_FILE/xcshareddata/xcschemes/"*.xcscheme | head -1) .xcscheme)
          echo "Scheme: $SCHEME"
          echo "SCHEME=$SCHEME" >> $GITHUB_ENV

      - name: Build Xcode archive (Unsigned)
        run: |
          cd ios
          xcodebuild -workspace "$(basename $WORKSPACE)" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$SCHEME.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package Payload into .IPA
        run: |
          cd ios
          mkdir -p Payload
          cp -r "$SCHEME.xcarchive/Products/Applications/$SCHEME.app" Payload/
          zip -r -q "$SCHEME.ipa" Payload
          mv "$SCHEME.ipa" ../StreamFlow.ipa

      - name: Upload .IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamFlow-iOS-IPA
          path: StreamFlow.ipa
          retention-days: 14
