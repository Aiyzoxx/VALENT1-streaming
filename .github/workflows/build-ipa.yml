name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build Xcode archive (Unsigned)
        run: |
          cd ios
          xcodebuild -workspace StreamFlow.xcworkspace \
            -scheme StreamFlow \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath StreamFlow.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package Payload into .IPA
        run: |
          cd ios
          mkdir -p Payload
          cp -r StreamFlow.xcarchive/Products/Applications/StreamFlow.app Payload/
          zip -r -q StreamFlow.ipa Payload
          mv StreamFlow.ipa ../StreamFlow.ipa

      - name: Upload .IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamFlow-iOS-IPA
          path: StreamFlow.ipa
          retention-days: 14
